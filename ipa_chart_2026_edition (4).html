<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPA Chart (my edition) 2026</title>
    <!-- Google Fonts: Noto Sans & Regional Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+JP:wght@400;600&family=Noto+Sans+SC:wght@400;600&family=Noto+Sans+TC:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans"', '"Noto Sans JP"', '"Noto Sans SC"', '"Noto Sans TC"', 'sans-serif'],
                        ipa: ['"Noto Sans"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Strict Formal Academic Styling - Sharp 0px corners, non-bold IPA symbols */
        * {
            border-radius: 0 !important;
        }

        body {
            font-family: 'Noto Sans', 'Noto Sans JP', 'Noto Sans SC', 'Noto Sans TC', sans-serif;
            background-color: #ffffff;
            color: #000000;
        }

        /* Chart Table Grid Styles */
        .phonemic-chart-table {
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed;
            border: 2px solid #000000;
        }

        .phonemic-chart-table th, 
        .phonemic-chart-table td {
            border: 1px solid #000000;
            text-align: center;
            vertical-align: middle;
            padding: 0;
            position: relative;
        }

        /* IPA Cell Interior */
        .cell-content {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            min-height: 4.25rem;
            padding: 0.35rem 0.15rem;
            box-sizing: border-box;
        }

        /* Symbol Weight MUST BE regular (400) */
        .ipa-symbol {
            font-family: 'Noto Sans', sans-serif;
            font-weight: 400 !important; /* Strictly regular, non-bold */
            font-size: 1.45rem;
            line-height: 1.1;
            color: #000000;
        }

        .ipa-example {
            font-size: 0.75rem;
            font-weight: 400;
            color: #222222;
            text-align: center;
            line-height: 1.1;
            word-break: break-word;
        }

        .ipa-example u {
            text-decoration-line: underline;
            text-underline-offset: 1px;
            font-weight: 600;
        }

        /* Vertical Side Headers */
        .side-header {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background-color: #e5e5e5;
            color: #000000;
            width: 2.2rem;
            border-right: 2px solid #000000 !important;
        }

        /* Sub-category Header Rows */
        .cat-header {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: lowercase;
            letter-spacing: 0.05em;
            background-color: #eaeaea;
            color: #000000;
            padding: 0.25rem;
            border-bottom: 1px solid #000000;
        }

        /* Re-evaluated Category Background Colors */
        .type-mono { background-color: #f0f0f0; } /* Monophthongs: Light Grey */
        .type-diph { background-color: #b0b0b0; } /* Diphthongs: Dark Grey */
        .type-nasal { background-color: #cce5ff; } /* Nasal Vowels: Blue */
        .type-semi { background-color: #e2d0f9; } /* Semivowels: Purple */
        .type-cons { background-color: #ffff99; } /* Consonants: Soft Yellow */
        .type-allo { background-color: #ffe8cc; } /* Allophones: Soft Coral/Orange */
        .type-loan { background-color: #d4edda; } /* Marginal / Loanwords: Green */
        .type-note { background-color: #f8d7da; } /* Mergers & Notes: Light Red/Pink */

        /* Sharp Navigation Tabs */
        .sharp-tab {
            border: 1px solid #000000;
            background-color: #f8f9fa;
            color: #000000;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.4rem 0.75rem;
            margin-right: -1px;
            margin-bottom: -1px;
            cursor: pointer;
            transition: none;
        }

        .sharp-tab:hover {
            background-color: #e2e8f0;
        }

        .sharp-tab.active {
            background-color: #000000;
            color: #ffffff;
        }

        /* Print formatting */
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
            }
            .phonemic-chart-table {
                border: 2px solid #000000 !important;
                page-break-inside: avoid;
            }
            .phonemic-chart-table th, 
            .phonemic-chart-table td {
                border: 1px solid #000000 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .cell-content {
                min-height: 3.5rem !important;
                padding: 0.15rem !important;
            }
            .ipa-symbol {
                font-size: 1.2rem !important;
            }
        }
    </style>
</head>
